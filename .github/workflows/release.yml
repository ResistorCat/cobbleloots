name: Release Automation

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: "Semantic Version Bump Type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
          - custom
        default: patch
      custom_version:
        description: "Custom Version (only if bump_type is 'custom', e.g. 2.3.0-beta.1)"
        required: false
        default: ""
      channel:
        description: "Release Channel"
        required: true
        type: choice
        options:
          - beta
          - release
          - alpha
        default: beta

permissions:
  contents: write

jobs:
  release:
    name: Cut Release & Publish Artifacts
    runs-on: ubuntu-latest

    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx5g -Dorg.gradle.daemon=false -Dorg.gradle.parallel=false"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
      CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Configure Git User
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Calculate Version & Generate Changelog
        id: release_meta
        run: |
          node scripts/generate-release.mjs \
            --bump "${{ github.event.inputs.bump_type }}" \
            --custom "${{ github.event.inputs.custom_version }}" \
            --channel "${{ github.event.inputs.channel }}"

      - name: Commit Release Changes & Tag
        run: |
          TAG_NAME="${{ steps.release_meta.outputs.tag_name }}"
          git add gradle.properties CHANGELOG.md
          git commit -m "chore(release): ${TAG_NAME} [skip ci]"
          git tag -a "${TAG_NAME}" -m "Release ${TAG_NAME}"
          git push origin main
          git push origin "${TAG_NAME}"

      - name: Build Loader Jars
        run: |
          chmod +x ./gradlew
          ./gradlew build

      - name: Locate Artifacts
        id: artifacts
        run: |
          mkdir -p dist
          find fabric/build/libs neoforge/build/libs -name "*.jar" ! -name "*-sources.jar" ! -name "*-dev.jar" -exec cp {} dist/ \;
          echo "Found artifacts:"
          ls -la dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag_name }}
          name: "Cobbleloots ${{ steps.release_meta.outputs.tag_name }}"
          body_path: .release_notes.md
          prerelease: ${{ github.event.inputs.channel != 'release' }}
          files: dist/*.jar

      - name: Publish to Modrinth (Optional)
        if: env.MODRINTH_TOKEN != ''
        run: |
          echo "MODRINTH_TOKEN found. Publishing via API..."
          node scripts/publish-platforms.mjs --platform modrinth --version "${{ steps.release_meta.outputs.version }}" --channel "${{ github.event.inputs.channel }}"

      - name: Publish to CurseForge (Optional)
        if: env.CURSEFORGE_TOKEN != ''
        run: |
          echo "CURSEFORGE_TOKEN found. Publishing via API..."
          node scripts/publish-platforms.mjs --platform curseforge --version "${{ steps.release_meta.outputs.version }}" --channel "${{ github.event.inputs.channel }}"

