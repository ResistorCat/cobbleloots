name: Release Automation

on:
  push:
    branches:
      - main
      - 'mc/**'
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel to publish"
        required: true
        type: choice
        default: alpha
        options:
          - alpha
          - beta
          - release
      dry_run:
        description: "Dry-run mode (verify build and calculation without committing or publishing)"
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      channel:
        description: "Release channel (alpha, beta, release)"
        required: true
        type: string
      branch:
        description: "Target branch name"
        required: false
        type: string
        default: main
      target_ref:
        description: "Optional git ref (tag or commit) to build and tag the release on"
        required: false
        type: string
        default: ""
      dry_run:
        description: "Dry-run mode (verify build and calculation without committing or publishing)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Automated Multi-Channel Release
    runs-on: ubuntu-latest

    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx5g -Dorg.gradle.daemon=false -Dorg.gradle.parallel=false"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          ref: ${{ inputs.target_ref || github.ref }}
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle Cache & Toolchain
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python Dependencies
        run: pip install -r scripts/requirements.txt

      - name: Configure Git Credentials
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run Semantic Versioning Analysis
        id: versioning
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DRY_RUN_ARG=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            DRY_RUN_ARG="--dry-run"
          fi

          TARGET_BRANCH="${{ inputs.branch || github.ref_name }}"

          if [ -n "${{ inputs.channel }}" ]; then
            python scripts/release.py --branch "$TARGET_BRANCH" --channel "${{ inputs.channel }}" $DRY_RUN_ARG
          else
            python scripts/release.py --branch "$TARGET_BRANCH" --detect-pr-channel --commit "${{ github.sha }}" --repo "${{ github.repository }}" $DRY_RUN_ARG
          fi

      - name: Check Release Requirement
        if: steps.versioning.outputs.has_release != 'true'
        run: |
          echo "No mod changes detected requiring a release. Exiting cleanly."

      - name: Compile Mod JARs
        if: steps.versioning.outputs.has_release == 'true'
        run: |
          chmod +x ./gradlew
          ./gradlew remapJar --stacktrace

      - name: Check Dry Run
        if: steps.versioning.outputs.has_release == 'true' && inputs.dry_run == true
        run: |
          echo "=== DRY RUN SUMMARY ==="
          echo "Target Version: ${{ steps.versioning.outputs.mod_version }}"
          echo "Target Channel: ${{ steps.versioning.outputs.mod_version_type }}"
          echo "Tag: ${{ steps.versioning.outputs.tag }}"
          if [ -f .release_notes.md ]; then
            cat .release_notes.md
          fi
          echo "Dry run completed. No git commits or external releases made."

      - name: Commit & Tag Release
        if: steps.versioning.outputs.has_release == 'true' && inputs.dry_run != true
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          TARGET_BRANCH="${{ inputs.branch || github.ref_name }}"
          TARGET_REF="${{ inputs.target_ref }}"
          TAG="${{ steps.versioning.outputs.tag }}"

          git add -A .changelog gradle.properties CHANGELOG.md
          git commit -m "chore(release): ${TAG} [skip ci]"
          git tag -a "${TAG}" -m "Release ${TAG}"

          if [ -n "$TARGET_REF" ]; then
            BETA_PARENT=$(git rev-parse HEAD~1)
            git fetch origin "${TARGET_BRANCH}"
            BRANCH_HEAD=$(git rev-parse FETCH_HEAD)
            if [ "$BETA_PARENT" = "$BRANCH_HEAD" ]; then
              git push origin "HEAD:refs/heads/${TARGET_BRANCH}" "${TAG}"
            else
              echo "Branch ${TARGET_BRANCH} moved past ${TARGET_REF}; pushing tag ${TAG} only."
              git push origin "${TAG}"
            fi
          else
            git push origin "${TARGET_BRANCH}" "${TAG}"
          fi

      - name: Create GitHub Release
        if: steps.versioning.outputs.has_release == 'true' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          PRERELEASE_FLAG=""
          if [ "${{ steps.versioning.outputs.is_prerelease }}" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          gh release create "${{ steps.versioning.outputs.tag }}" \
            --title "Cobbleloots ${{ steps.versioning.outputs.tag }} [${{ steps.versioning.outputs.minecraft_version }}]" \
            --notes-file ".release_notes.md" \
            $PRERELEASE_FLAG \
            fabric/build/libs/cobbleloots-fabric-${{ steps.versioning.outputs.minecraft_version }}-${{ steps.versioning.outputs.mod_version }}.jar \
            neoforge/build/libs/cobbleloots-neoforge-${{ steps.versioning.outputs.minecraft_version }}-${{ steps.versioning.outputs.mod_version }}.jar

      - name: Publish to Modrinth and CurseForge
        if: steps.versioning.outputs.has_release == 'true' && inputs.dry_run != true
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          MODRINTH_PROJECT_ID: ${{ secrets.MODRINTH_PROJECT_ID }}
          CURSEFORGE_PROJECT_ID: ${{ secrets.CURSEFORGE_PROJECT_ID }}
        run: |
          if [ -z "$MODRINTH_TOKEN" ] || [ -z "$CURSEFORGE_TOKEN" ]; then
            echo "Error: Required secrets MODRINTH_TOKEN or CURSEFORGE_TOKEN are missing."
            exit 1
          fi
          python scripts/publish.py publish --yes
