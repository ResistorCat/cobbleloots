name: Gradle CI

on:
  pull_request:
    branches:
      - main
      - master
      - beta
      - alpha
  push:
    branches:
      - main
      - master
      - beta
      - alpha

permissions:
  contents: read

jobs:
  build:
    name: Build & Verify (Fabric & NeoForge)
    runs-on: ubuntu-latest

    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx5g -Dorg.gradle.daemon=false -Dorg.gradle.parallel=false"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle Cache & Toolchain
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' && github.ref != 'refs/heads/beta' && github.ref != 'refs/heads/alpha' }}

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Compile and Build Mod Jars
        run: ./gradlew build --stacktrace

