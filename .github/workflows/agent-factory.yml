name: Agent Software Factory

on:
  repository_dispatch:
    types: [linear_agent_task]
  workflow_dispatch:
    inputs:
      issue_identifier:
        description: "Linear Issue Identifier (e.g. DEV-5)"
        required: true
      issue_title:
        description: "Linear Issue Title"
        required: true
      issue_description:
        description: "Issue Description & Acceptance Criteria"
        required: false
        default: ""
      issue_url:
        description: "Linear Issue URL"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  solve_task:
    name: Autonomous Agent Execution
    runs-on: ubuntu-latest

    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx5g -Dorg.gradle.daemon=false -Dorg.gradle.parallel=false"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - name: Extract Ticket Parameters
        id: params
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "IDENTIFIER=${{ github.event.client_payload.issue.identifier }}" >> $GITHUB_OUTPUT
            echo "TITLE=${{ github.event.client_payload.issue.title }}" >> $GITHUB_OUTPUT
            echo "DESCRIPTION<<EOF" >> $GITHUB_OUTPUT
            echo "${{ github.event.client_payload.issue.description }}" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            echo "URL=${{ github.event.client_payload.issue.url }}" >> $GITHUB_OUTPUT
            echo "BRANCH=${{ github.event.client_payload.issue.branchName }}" >> $GITHUB_OUTPUT
            echo "ISSUE_ID=${{ github.event.client_payload.issue.id }}" >> $GITHUB_OUTPUT
          else
            echo "IDENTIFIER=${{ github.event.inputs.issue_identifier }}" >> $GITHUB_OUTPUT
            echo "TITLE=${{ github.event.inputs.issue_title }}" >> $GITHUB_OUTPUT
            echo "DESCRIPTION<<EOF" >> $GITHUB_OUTPUT
            echo "${{ github.event.inputs.issue_description }}" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            echo "URL=${{ github.event.inputs.issue_url }}" >> $GITHUB_OUTPUT
            SLUG=$(echo "${{ github.event.inputs.issue_title }}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g' | sed -E 's/^-+|-+$//g' | cut -c1-40)
            echo "BRANCH=agent/${{ github.event.inputs.issue_identifier }}-${SLUG}" >> $GITHUB_OUTPUT
            echo "ISSUE_ID=" >> $GITHUB_OUTPUT
          fi

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Configure Git User
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create or Checkout Agent Branch
        run: |
          BRANCH="${{ steps.params.outputs.BRANCH }}"
          echo "Checking out branch: $BRANCH"
          git checkout -b "$BRANCH" || git checkout "$BRANCH"

      - name: Run Agent Execution & Quality Gate Loop
        id: agent_loop
        env:
          ISSUE_IDENTIFIER: ${{ steps.params.outputs.IDENTIFIER }}
          ISSUE_TITLE: ${{ steps.params.outputs.TITLE }}
          ISSUE_DESCRIPTION: ${{ steps.params.outputs.DESCRIPTION }}
          ISSUE_URL: ${{ steps.params.outputs.URL }}
          ISSUE_ID: ${{ steps.params.outputs.ISSUE_ID }}
        run: |
          chmod +x ./gradlew
          node scripts/run-agent-task.mjs

      - name: Create Pull Request if Successful
        if: steps.agent_loop.outputs.status == 'success'
        env:
          ISSUE_IDENTIFIER: ${{ steps.params.outputs.IDENTIFIER }}
          ISSUE_TITLE: ${{ steps.params.outputs.TITLE }}
          BRANCH: ${{ steps.params.outputs.BRANCH }}
        run: |
          git push -u origin "$BRANCH"

          # Determine commit type from issue title or default to feat
          PR_TITLE="[${ISSUE_IDENTIFIER}] feat: ${ISSUE_TITLE}"
          if [[ "${ISSUE_TITLE}" =~ ^(feat|fix|refactor|perf|chore|test)\( ]]; then
            PR_TITLE="[${ISSUE_IDENTIFIER}] ${ISSUE_TITLE}"
          fi

          PR_URL=$(gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "$PR_TITLE" \
            --body-file .pr_body.md)

          echo "PR created: $PR_URL"
          echo "PR_URL=$PR_URL" >> $GITHUB_ENV

      - name: Update Linear Issue (In Review or Blocked)
        if: always()
        env:
          STATUS: ${{ steps.agent_loop.outputs.status }}
          PR_URL: ${{ env.PR_URL }}
          ISSUE_ID: ${{ steps.params.outputs.ISSUE_ID }}
          ISSUE_IDENTIFIER: ${{ steps.params.outputs.IDENTIFIER }}
        run: |
          node scripts/sync-linear-status.mjs

