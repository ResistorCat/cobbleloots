pluginManagement {
    repositories {
        // Restricted to their own groups so a 5xx on one repo never blocks the others.
        maven {
            url "https://maven.fabricmc.net/"
            content { includeGroupByRegex "net\\.fabricmc(\\..*)?" }
        }
        maven {
            url "https://maven.architectury.dev/"
            content {
                includeGroupByRegex "dev\\.architectury(\\..*)?"
                includeGroup "architectury-plugin"
                includeGroup "com.mojang"
            }
        }
        maven {
            url "https://files.minecraftforge.net/maven/"
            content {
                includeGroupByRegex "net\\.minecraftforge(\\..*)?"
                includeGroup "de.oceanlabs.mcp"
            }
        }
        gradlePluginPortal()
        mavenCentral()
    }
}

rootProject.name = 'cobbleloots'

include 'common'
include 'fabric'
include 'neoforge'
